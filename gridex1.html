<!doctype html>
<html>
    <head>
        <title>
          Grid layout Example
        </title>
        <meta name="viewport" content="width=device-width,initial-sclae=1.0" />
        <style type="text/css">
        div.container{
            display:grid;
            grid-template-columns: 200px 400px 300px 50px;
            border:3px solid blueviolet;
            
        }

        div.container div{
            border:1px solid grey;
            padding:20px;
        }
    </style>
    </head>
    <body>
      <div class="container">
        <div>header</div> 
        <div>section 1 </div>
        <div>section 2</div>
        <div>section 3</div>
        <div>section 4</div>
        <div>section 5</div>
        <div>footer</div>



      </div>
    </body>
</html>
