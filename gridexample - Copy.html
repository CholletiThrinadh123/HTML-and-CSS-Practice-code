<!doctype html>
<html>
    <head>
        <title>grid Example</title>
        <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
        <style type="text/css"> 
            div.gcon{
                display:grid;
                grid-template-columns: 100px 70px;
                gap:10px;
                
            }
            div.gitem{
               border:1px solid aquamarine;
            }
        </style>
          
    </head>
    <body>
      <div class="gcon">
        <div class="gitem"> 1</div>
        <div class="gitem"> 2</div>
        <div class="gitem"> 3</div>
        <div class="gitem"> 4</div>
        <div class="gitem"> 5</div>
        <div class="gitem"> 6</div>
      </div>
      <br/>
      <br/>
      


    </body>
</html>
