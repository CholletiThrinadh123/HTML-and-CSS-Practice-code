<!--program to demonstrate the Animations
<!doctype html>
<html>
    <head>
        <title>Animations Example</title>
        <style type="text/css">
            @keyframes Bhanu{
                0%{
                    width:200px;
                height:200px;
                  background-color: black;
                color:whitesmoke;
                margin-top:0px;
                margin-left: 100px;  
                }
                50%{
                     width:300px;
                height:300px;
                   background-color:red;
                color:blue;
                margin-top:100px; 
                margin-left: 200px; 
                }
                100%{
                      width:300px;
                height:300px;
                   background-color:pink;
                color:black; 
                margin-top:500px; 
                margin-left: 300px;
                }
                    
                
            }
            div{
                width:200px;
                height:200px;
                background-color: black;
                color:whitesmoke;
                animation-name: Bhanu;
                animation-duration:3s;
            }
        </style>
        <body>
            <div>
                Hi, Welcome to Bhanu page
            </div>
        </body>
    </head>
</html>
